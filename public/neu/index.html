<title>HKL Standards</title>
<script>
/* Ohne Schrägstrich am Ende zeigten alle relativen Pfade ins Leere. */
if(!/\/$/.test(location.pathname) && !/index\.html$/.test(location.pathname)) location.replace(location.pathname+'/'+location.search+location.hash);
</script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">

<body>
<div class="app">
  <header class="bar">
    <div id="naLeiste"></div>
    <div class="bar-row">
      <button class="icon-btn" id="naZurueck" hidden aria-label="Zurück">‹</button>
      <div class="bar-title"><h1 id="naTitel">HKL Standards</h1><div class="crumb" id="naPfad">Lädt…</div></div>
      <span id="naPunkt" class="sync-dot" role="status" aria-live="polite" title="Server-Status"></span>
      <button class="icon-btn" id="naAnmelden" aria-label="Verwaltung">🔓</button>
      <button class="icon-btn" id="naThema" aria-label="Ansicht wechseln">◐</button>
    </div>
  </header>
  <main id="naMain"></main>
  <nav class="na-tabs" id="naTabs"></nav>
</div>
<div class="toast" id="toast"></div>
<div class="sheet-overlay" id="naSheetOv"></div>
<div class="sheet" id="naSheet" role="dialog" aria-modal="true"></div>
<input type="file" id="naDatei" accept="image/*" capture="environment" hidden>
<input type="file" id="naDateiWahl" accept="image/*" multiple hidden>
<input type="file" id="naDateiJson" accept="application/json,.json" hidden>
